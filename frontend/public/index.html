<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deye Logger Viewer — Real-time solar inverter telemetry data visualization">
  <meta property="og:title" content="Deye Logger Viewer">
  <meta property="og:description" content="Real-time solar inverter telemetry data visualization">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Deye Logger Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ============================================================
       TITLE BAR — always visible, persistent
       ============================================================ -->
  <div class="header">
    <h1>☀️ <span>Deye</span> Logger Viewer</h1>
    <div class="controls">
      <label for="date-from">From</label>
      <input type="date" id="date-from">
      <label for="date-to">To</label>
      <input type="date" id="date-to">
      <button class="btn-view" id="prev-day" title="Previous day">‹</button>
      <button class="btn-view" id="next-day" title="Next day">›</button>
      <button class="btn-view" id="today-btn" title="Go to today's date">Today</button>
      <button class="btn-view" id="refresh-btn" title="Update database from inverter">↻ Refresh</button>

      <button class="columns-toggle" id="columns-toggle" title="Select columns to display">☰ Select</button>
      <button class="btn-view" id="view-toggle" title="Switch between view modes">📋 Data Grid</button>
      <button class="btn-view" id="histogram-btn" title="Show binned average histogram">📊 Histogram</button>
      <button class="btn-export" id="export-btn" style="display:none" title="Export data as CSV">⬇ CSV</button>

      <!-- Histogram controls — visible only in histogram modes -->
      <div class="histogram-controls" id="histogram-controls" style="display:none">
        <div class="histogram-control-group">
          <label for="bin-size-select">Bin size</label>
          <select id="bin-size-select">
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="15" selected>15 min</option>
            <option value="30">30 min</option>
            <option value="60">1 hour</option>
          </select>
        </div>
        <div class="histogram-control-group">
          <label for="day-filter-select">Day</label>
          <select id="day-filter-select">
            <option value="all" selected>All</option>
            <option value="sun">Sun</option>
            <option value="mon">Mon</option>
            <option value="tue">Tue</option>
            <option value="wed">Wed</option>
            <option value="thu">Thu</option>
            <option value="fri">Fri</option>
            <option value="sat">Sat</option>
          </select>
        </div>
        <button class="btn-view" id="split-btn" title="Split into individual charts">Split</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       STATE BAR — always visible, persistent
       ============================================================ -->
  <div class="status-bar">
    <span id="row-count"></span>
    <span class="status-separator">|</span>
    <span id="view-label"></span>
    <span id="version-badge" style="margin-left: auto;"></span>
  </div>

  <!-- ============================================================
       CONTENT AREA — single scrollable container
       Wraps summary cards (top) + one visible content panel
       Managed exclusively by setView()
       ============================================================ -->
  <div id="content-area" class="content-area">

    <!-- Summary cards — shown with data views, always at top -->
    <div class="summary-cards" id="summary-cards"></div>

    <!-- Waiting view — spinner + text, shown during all async operations -->
    <div id="waiting-view" class="content-panel">
      <div class="waiting-content">
        <div class="spinner"></div>
        <div id="waiting-text">Loading…</div>
      </div>
    </div>

    <!-- Error view — modal overlay with Close button -->
    <div id="error-view" class="content-panel error-overlay">
      <div class="error-content">
        <h2>⚠️ Error</h2>
        <p id="error-message"></p>
        <button id="error-close-btn" title="Close and return to previous page">Close</button>
      </div>
    </div>

    <!-- Info view — non-modal info message panel (transient) -->
    <div id="info-view" class="content-panel">
      <div class="info-content">
        <div class="info-icon">ℹ️</div>
        <div id="info-message"></div>
      </div>
    </div>

    <!-- Columns view — column selection panel (transient) -->
    <div id="columns-view" class="content-panel">
      <div id="columns-view-inner"></div>
    </div>

    <!-- Raw data chart view -->
    <div id="raw-data-chart-view" class="content-panel raw-data-chart-view">
      <div class="chart-canvas-wrap">
        <canvas id="chart-canvas"></canvas>
      </div>
    </div>

    <!-- Raw data grid view -->
    <div id="raw-data-grid-view" class="content-panel raw-data-grid-view">
      <div id="grid-container" class="ag-theme-quartz"></div>
    </div>

    <!-- Histogram combined view -->
    <div id="histogram-view" class="content-panel histogram-view">
      <div class="chart-canvas-wrap">
        <canvas id="histogram-canvas"></canvas>
      </div>
    </div>

    <!-- Histogram grid view -->
    <div id="histogram-grid-view" class="content-panel histogram-grid-view">
      <div id="histogram-grid-container" class="ag-theme-quartz"></div>
    </div>

    <!-- Split histogram view -->
    <div id="split-histogram-view" class="content-panel split-histogram-view">
      <div id="split-histogram-scroll">
        <!-- Individual histogram canvases go here -->
      </div>
    </div>

  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
